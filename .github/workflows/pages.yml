name: Demo

# Deploys recipes/vanilla and recipes/react to GitHub Pages.
# Repo Settings → Pages → Source must be set to "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Recipes alias the packages to their src, so no package build is needed.
      - run: pnpm --filter @open-tw/recipe-vanilla exec vite build --base /icon-picker/vanilla/ --outDir ../../_site/vanilla --emptyOutDir
      - run: pnpm --filter @open-tw/recipe-react exec vite build --base /icon-picker/react/ --outDir ../../_site/react --emptyOutDir
      - run: cp .github/pages/index.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
